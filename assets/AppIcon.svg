<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Recordo app icon, direction B</title>
  <desc id="description">A checked ivory flashcard rising from a brass Leitner box on a midnight-indigo leather tile.</desc>

  <defs>
    <linearGradient id="leather" x1="196" y1="118" x2="838" y2="918" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#303B58"/>
      <stop offset="0.48" stop-color="#20283F"/>
      <stop offset="1" stop-color="#111622"/>
    </linearGradient>
    <radialGradient id="warmth" cx="0" cy="0" r="1" gradientTransform="translate(512 420) rotate(90) scale(438)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#AE704B" stop-opacity="0.31"/>
      <stop offset="0.52" stop-color="#64607C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#111622" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="350" y1="565" x2="704" y2="777" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE2A2"/>
      <stop offset="0.28" stop-color="#FFB354"/>
      <stop offset="0.7" stop-color="#D5793D"/>
      <stop offset="1" stop-color="#9D482C"/>
    </linearGradient>
    <linearGradient id="card" x1="419" y1="345" x2="612" y2="655" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.6" stop-color="#F5ECDD"/>
      <stop offset="1" stop-color="#DCC8AC"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="512" y1="613" x2="512" y2="776" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E7A65D"/>
      <stop offset="1" stop-color="#A65B36"/>
    </linearGradient>
    <filter id="tileShadow" x="32" y="36" width="960" height="968" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#090609" flood-opacity="0.44"/>
    </filter>
    <filter id="markShadow" x="236" y="218" width="552" height="590" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#090609" flood-opacity="0.38"/>
    </filter>
    <filter id="brassGlow" x="264" y="218" width="516" height="590" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#F09A49" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#090609" flood-opacity="0.32"/>
    </filter>
    <clipPath id="tileClip"><rect x="82" y="82" width="860" height="860" rx="208"/></clipPath>
  </defs>

  <g filter="url(#tileShadow)"><rect x="82" y="82" width="860" height="860" rx="208" fill="url(#leather)"/></g>
  <g clip-path="url(#tileClip)">
    <rect x="82" y="82" width="860" height="860" fill="url(#warmth)"/>
    <ellipse cx="512" cy="798" rx="292" ry="92" fill="#080A11" opacity="0.2"/>
    <path d="M122 218C282 126 468 100 640 127C760 146 853 189 928 251" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="16" stroke-linecap="round"/>
  </g>
  <rect x="83.5" y="83.5" width="857" height="857" rx="206.5" fill="none" stroke="#FFE0AE" stroke-opacity="0.13" stroke-width="3"/>
  <rect x="102" y="102" width="820" height="820" rx="190" fill="none" stroke="#080608" stroke-opacity="0.31" stroke-width="4"/>

  <g filter="url(#markShadow)">
    <rect x="389" y="295" width="246" height="334" rx="26" fill="url(#card)" stroke="#FFFDF5" stroke-opacity="0.72" stroke-width="6"/>
    <path d="M414 311H610" fill="none" stroke="#FFFFFF" stroke-opacity="0.46" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path d="M442 454L494 505L589 398" fill="none" stroke="#A85B33" stroke-opacity="0.25" stroke-width="41" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 8)"/>
  <path d="M442 454L494 505L589 398" fill="none" stroke="#D88242" stroke-width="37" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M442 452L494 503L589 396" fill="none" stroke="#FFE1A0" stroke-opacity="0.52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#brassGlow)">
    <path d="M305 577L395 542H629L719 577L683 625H341Z" fill="#7E452E" stroke="#ECAA69" stroke-width="6" stroke-linejoin="round"/>
    <path d="M305 577H719L692 754C689 772 676 781 657 781H367C348 781 335 772 332 754Z" fill="url(#boxFront)" stroke="#F6C07A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M312 587H712" fill="none" stroke="#FFE3A2" stroke-opacity="0.67" stroke-width="9" stroke-linecap="round"/>
    <path d="M357 638H667" fill="none" stroke="#7A402F" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>
    <path d="M488 656H536" fill="none" stroke="#FFE4A8" stroke-opacity="0.78" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
